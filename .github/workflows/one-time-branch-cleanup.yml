name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" --paginate --jq '.[].ref' |
          while read -r ref; do
            branch="${ref#refs/heads/}"
            if [ "$branch" != "main" ] && [ "$branch" != "1.9.16" ]; then
              encoded_branch="${branch//\//%2F}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            fi
          done
